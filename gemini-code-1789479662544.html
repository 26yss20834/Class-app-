<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>퀴즈 프로그램</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* 메인 컨테이너 */
        .quiz-container {
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 600px;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* 상단 헤더 */
        .quiz-header {
            background-color: #4a90e2;
            color: white;
            padding: 20px;
            text-align: center;
            position: relative;
            flex-shrink: 0;
        }

        /* 왼쪽 위 개발자 트리거 영역 (완전 투명) */
        .dev-trigger-area {
            position: absolute;
            top: 0;
            left: 0;
            width: 60px;
            height: 60px;
            z-index: 100;
            cursor: default;
            user-select: none;
        }

        .quiz-header h1 {
            font-size: 1.5rem;
            margin-bottom: 8px;
        }

        .quiz-info {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            opacity: 0.9;
        }

        /* 본문 영역 (스크롤 적용) */
        .quiz-body {
            padding: 24px;
            overflow-y: auto;
            flex-grow: 1;
        }

        /* 스크롤바 스타일링 */
        .quiz-body::-webkit-scrollbar {
            width: 8px;
        }
        .quiz-body::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 4px;
        }
        .quiz-body::-webkit-scrollbar-thumb {
            background: #ccc;
            border-radius: 4px;
        }
        .quiz-body::-webkit-scrollbar-thumb:hover {
            background: #999;
        }

        .question-text {
            font-size: 1.15rem;
            font-weight: 600;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-btn {
            background-color: #f8f9fa;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            padding: 14px 16px;
            text-align: left;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s ease;
            outline: none;
        }

        .option-btn:hover {
            background-color: #e9ecef;
            border-color: #ced4da;
        }

        .option-btn.selected {
            background-color: #e7f1ff;
            border-color: #4a90e2;
            color: #4a90e2;
            font-weight: bold;
        }

        .option-btn.correct {
            background-color: #d4edda;
            border-color: #28a745;
            color: #155724;
        }

        .option-btn.incorrect {
            background-color: #f8d7da;
            border-color: #dc3545;
            color: #721c24;
        }

        /* 하단 푸터 */
        .quiz-footer {
            padding: 16px 24px;
            background-color: #fafafa;
            border-top: 1px solid #eee;
            display: flex;
            justify-content: flex-end;
            flex-shrink: 0;
        }

        .btn {
            background-color: #4a90e2;
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn:hover {
            background-color: #357abd;
        }

        .btn:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }

        /* 결과 화면 */
        .result-screen {
            text-align: center;
            padding: 20px 0;
        }

        .result-title {
            font-size: 1.8rem;
            color: #4a90e2;
            margin-bottom: 16px;
        }

        .result-score {
            font-size: 1.2rem;
            margin-bottom: 12px;
        }

        .result-time {
            font-size: 1.1rem;
            color: #6c757d;
            margin-bottom: 24px;
        }

        /* ----------------------------------
           개발자 탭 (완전 숨김 레이어)
        ---------------------------------- */
        .dev-modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.7);
            z-index: 9999;
            justify-content: center;
            align-items: center;
        }

        .dev-modal {
            background: #1e1e1e;
            color: #00ff66;
            font-family: monospace;
            padding: 24px;
            border-radius: 10px;
            width: 90%;
            max-width: 420px;
            box-shadow: 0 0 20px rgba(0, 255, 102, 0.2);
            border: 1px solid #00ff66;
        }

        .dev-modal h2 {
            font-size: 1.2rem;
            margin-bottom: 16px;
            text-align: center;
            border-bottom: 1px solid #333;
            padding-bottom: 8px;
            color: #fff;
        }

        .dev-group {
            margin-bottom: 16px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .dev-group label {
            font-size: 0.85rem;
            color: #aaa;
        }

        .dev-group input {
            background: #2b2b2b;
            border: 1px solid #444;
            color: #fff;
            padding: 8px;
            border-radius: 4px;
            font-family: monospace;
        }

        .dev-btns {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 16px;
        }

        .dev-btn {
            background: #333;
            color: #00ff66;
            border: 1px solid #00ff66;
            padding: 10px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-family: monospace;
            transition: all 0.2s;
        }

        .dev-btn:hover {
            background: #00ff66;
            color: #1e1e1e;
        }

        .dev-btn-close {
            background: #444;
            color: #fff;
            border: none;
            margin-top: 8px;
        }
        .dev-btn-close:hover {
            background: #666;
            color: #fff;
        }
    </style>
</head>
<body>

    <div class="quiz-container">
        <!-- 왼쪽 상단 투명 클릭 영역 (이스터에그 트리거) -->
        <div class="dev-trigger-area" id="devTrigger"></div>

        <div class="quiz-header">
            <h1>퀴즈 테스트</h1>
            <div class="quiz-info">
                <span>문제 <span id="current-q">1</span> / <span id="total-q">3</span></span>
                <span>시간: <span id="timer-display">00:00</span></span>
            </div>
        </div>

        <div class="quiz-body" id="quiz-body">
            <!-- 문제 출력 영역 -->
            <div id="quiz-content">
                <div class="question-text" id="question-text">문제를 불러오는 중...</div>
                <div class="options-container" id="options-container"></div>
            </div>

            <!-- 결과 출력 영역 -->
            <div id="result-content" class="result-screen" style="display: none;">
                <h2 class="result-title">퀴즈 완료!</h2>
                <div class="result-score">최종 점수: <span id="final-score">0</span>점</div>
                <div class="result-time">총 걸린 시간: <span id="final-time">0초</span></div>
                <button class="btn" onclick="restartQuiz()">다시 풀기</button>
            </div>
        </div>

        <div class="quiz-footer" id="quiz-footer">
            <button class="btn" id="next-btn" onclick="nextQuestion()" disabled>다음 문제</button>
        </div>
    </div>

    <!-- 개발자 모드 전용 숨겨진 패널 (평소 절대 비노출) -->
    <div class="dev-modal-overlay" id="devModal">
        <div class="dev-modal">
            <h2>🛠️ DEV CONSOLE (EASTER EGG)</h2>
            
            <div class="dev-group">
                <label>소요 시간 조작 (초 단위):</label>
                <input type="number" id="devTimeInput" placeholder="예: 10 (10초)">
                <button class="dev-btn" onclick="devSetTime()">시간 적용</button>
            </div>

            <div class="dev-group">
                <label>획득 점수 조작:</label>
                <input type="number" id="devScoreInput" placeholder="예: 100">
                <button class="dev-btn" onclick="devSetScore()">점수 적용</button>
            </div>

            <div class="dev-btns">
                <button class="dev-btn" onclick="devAutoSolve()">⚡ 현재 문제 자동 풀이 (정답 처리)</button>
                <button class="dev-btn dev-btn-close" onclick="closeDevModal()">닫기</button>
            </div>
        </div>
    </div>

    <script>
        // 퀴즈 데이터 예시
        const quizData = [
            {
                question: "1. 다음 중 JavaScript의 원시 타입(Primitive Type)이 아닌 것은 무엇인가요?",
                options: ["String", "Number", "Array", "Boolean"],
                answer: 2
            },
            {
                question: "2. CSS에서 요소를 중앙 정렬하기 위해 사용되는 Flexbox 속성 조합으로 올바른 것은?",
                options: [
                    "justify-content: center; align-items: center;",
                    "text-align: center; vertical-align: middle;",
                    "margin: auto; display: block;",
                    "float: center; position: absolute;"
                ],
                answer: 0
            },
            {
                question: "3. HTML5에서 웹 페이지의 비디오를 재생할 때 사용하는 태그는 무엇인가요?",
                options: ["<media>", "<movie>", "<video>", "<embed>"],
                answer: 2
            }
        ];

        let currentQuestionIndex = 0;
        let score = 0;
        let selectedOption = null;
        let startTime = 0;
        let elapsedTime = 0; // 초 단위
        let timerInterval = null;

        // HTML 요소
        const questionText = document.getElementById('question-text');
        const optionsContainer = document.getElementById('options-container');
        const nextBtn = document.getElementById('next-btn');
        const currentQEl = document.getElementById('current-q');
        const totalQEl = document.getElementById('total-q');
        const timerDisplay = document.getElementById('timer-display');
        const quizContent = document.getElementById('quiz-content');
        const resultContent = document.getElementById('result-content');
        const quizFooter = document.getElementById('quiz-footer');

        // 초기화
        function initQuiz() {
            currentQuestionIndex = 0;
            score = 0;
            elapsedTime = 0;
            totalQEl.textContent = quizData.length;
            quizContent.style.display = 'block';
            resultContent.style.display = 'none';
            quizFooter.style.display = 'flex';
            
            startTimer();
            loadQuestion();
        }

        // 타이머 시작
        function startTimer() {
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                elapsedTime++;
                updateTimerDisplay();
            }, 1000);
        }

        function updateTimerDisplay() {
            const minutes = Math.floor(elapsedTime / 60);
            const seconds = elapsedTime % 60;
            timerDisplay.textContent = 
                `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
        }

        // 문제 불러오기
        function loadQuestion() {
            selectedOption = null;
            nextBtn.disabled = true;
            nextBtn.textContent = (currentQuestionIndex === quizData.length - 1) ? "결과 보기" : "다음 문제";
            
            currentQEl.textContent = currentQuestionIndex + 1;
            const currentQuiz = quizData[currentQuestionIndex];
            questionText.textContent = currentQuiz.question;

            optionsContainer.innerHTML = '';
            currentQuiz.options.forEach((option, index) => {
                const button = document.createElement('button');
                button.classList.add('option-btn');
                button.textContent = option;
                button.onclick = () => selectOption(index);
                optionsContainer.appendChild(button);
            });
        }

        // 보기 선택
        function selectOption(index) {
            selectedOption = index;
            const buttons = optionsContainer.querySelectorAll('.option-btn');
            
            buttons.forEach((btn, i) => {
                btn.classList.remove('selected');
                if (i === index) btn.classList.add('selected');
            });

            nextBtn.disabled = false;
        }

        // 다음 문제 또는 결과 처리
        function nextQuestion() {
            if (selectedOption === null) return;

            // 정답 검사
            if (selectedOption === quizData[currentQuestionIndex].answer) {
                score += Math.round(100 / quizData.length);
            }

            currentQuestionIndex++;

            if (currentQuestionIndex < quizData.length) {
                loadQuestion();
            } else {
                showResult();
            }
        }

        // 결과 보기
        function showResult() {
            clearInterval(timerInterval);
            quizContent.style.display = 'none';
            quizFooter.style.display = 'none';
            resultContent.style.display = 'block';

            document.getElementById('final-score').textContent = score;
            
            const minutes = Math.floor(elapsedTime / 60);
            const seconds = elapsedTime % 60;
            let timeString = "";
            if (minutes > 0) timeString += `${minutes}분 `;
            timeString += `${seconds}초`;

            document.getElementById('final-time').textContent = timeString;
        }

        function restartQuiz() {
            initQuiz();
        }

        // ----------------------------------------------------
        // 이스터에그: 개발자 모드 진입 (왼쪽 위 10번 연속 클릭)
        // ----------------------------------------------------
        let devClickCount = 0;
        let devClickTimer = null;
        const devTrigger = document.getElementById('devTrigger');
        const devModal = document.getElementById('devModal');

        devTrigger.addEventListener('click', () => {
            devClickCount++;
            
            // 3초 내에 10번 연달아 클릭하지 않으면 리셋
            clearTimeout(devClickTimer);
            devClickTimer = setTimeout(() => {
                devClickCount = 0;
            }, 3000);

            if (devClickCount >= 10) {
                devClickCount = 0;
                openDevModal();
            }
        });

        function openDevModal() {
            devModal.style.display = 'flex';
        }

        function closeDevModal() {
            devModal.style.display = 'none';
        }

        // [개발자 기능 1] 푸는 시간 조작
        function devSetTime() {
            const inputVal = parseInt(document.getElementById('devTimeInput').value);
            if (!isNaN(inputVal) && inputVal >= 0) {
                elapsedTime = inputVal;
                updateTimerDisplay();
                alert(`시간이 ${inputVal}초로 설정되었습니다.`);
            }
        }

        // [개발자 기능 2] 점수 조작
        function devSetScore() {
            const inputVal = parseInt(document.getElementById('devScoreInput').value);
            if (!isNaN(inputVal)) {
                score = inputVal;
                alert(`점수가 ${inputVal}점으로 설정되었습니다.`);
            }
        }

        // [개발자 기능 3] 문제 자동 풀이
        function devAutoSolve() {
            if (quizContent.style.display === 'none') {
                alert("이미 퀴즈가 종료되었습니다.");
                return;
            }

            const correctIdx = quizData[currentQuestionIndex].answer;
            selectOption(correctIdx);

            const buttons = optionsContainer.querySelectorAll('.option-btn');
            buttons.forEach((btn, i) => {
                if (i === correctIdx) {
                    btn.classList.add('correct');
                }
            });

            setTimeout(() => {
                closeDevModal();
                nextQuestion();
            }, 300);
        }

        // 실행
        window.onload = initQuiz;
    </script>
</body>
</html>
